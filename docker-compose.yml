services:
  postgres:
    image: postgres:16-alpine
    container_name: orqestra_postgres
    environment:
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: orqestra_dev_password
      POSTGRES_DB: orqestra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra -d orqestra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: orqestra_backend
    environment:
      DATABASE_URL: postgresql+pg8000://orqestra:orqestra_dev_password@postgres:5432/orqestra_db
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: orqestra_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
